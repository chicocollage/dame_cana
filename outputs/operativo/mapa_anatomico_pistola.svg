<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%" style="background:#0f172a; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">MAPA ANATÓMICO: PUNTOS CLAVE PARA PISTOLA DE MASAJE</text>
  <text x="500" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Protocolo Biomecánico M5-5D-v1.0 · Calibración Neurosensorial y Seguridad Tisular</text>

  <!-- Legend Bar -->
  <g transform="translate(180, 85)">
    <!-- Pre-entreno -->
    <circle cx="15" cy="15" r="7" fill="#10b981" filter="url(#glowGreen)"/>
    <text x="30" y="19" fill="#e2e8f0" font-size="13" font-weight="600">Pre-Sesión (30–45 s): Activación &amp; ROM</text>

    <!-- Descarga -->
    <circle cx="285" cy="15" r="7" fill="#38bdf8" filter="url(#glowBlue)"/>
    <text x="300" y="19" fill="#e2e8f0" font-size="13" font-weight="600">Descarga / Descanso (90–120 s): Tono Parasimpático</text>

    <!-- Prohibido -->
    <circle cx="585" cy="15" r="7" fill="#ef4444" filter="url(#glowRed)"/>
    <text x="600" y="19" fill="#e2e8f0" font-size="13" font-weight="600">Zonas Rojas: Exclusión Absoluta</text>
  </g>

  <!-- ==================== VISTA ANTERIOR ==================== -->
  <g transform="translate(250, 130)">
    <text x="0" y="0" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700" letter-spacing="1">VISTA ANTERIOR (FRONTAL)</text>

    <!-- Silueta Humana Frontal -->
    <!-- Cabeza y Cuello -->
    <ellipse cx="0" cy="45" rx="20" ry="26" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1.5"/>
    <path d="M -12 70 Q -10 85 -28 95 Q -40 102 -68 115 Q -78 122 -82 135 L -105 240 Q -112 270 -115 315 L -115 330 Q -115 338 -108 338 Q -102 338 -100 328 L -90 250 L -72 165 Q -65 175 -50 185 L -45 285 Q -45 315 -58 340 L -62 460 Q -65 520 -58 575 L -58 600 Q -58 608 -50 608 Q -42 608 -42 595 L -35 520 Q -32 460 -22 365 L -15 340 Q -6 340 0 340 Q 6 340 15 340 L 22 365 Q 32 460 35 520 L 42 595 Q 42 608 50 608 Q 58 608 58 600 L 58 575 Q 65 520 62 460 L 58 340 Q 45 315 45 285 L 50 185 Q 65 175 72 165 L 90 250 L 100 328 Q 102 338 108 338 Q 115 338 115 330 L 115 315 Q 112 270 105 240 L 82 135 Q 78 122 68 115 Q 40 102 28 95 Q 10 85 12 70 Z" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Puntos Vista Anterior -->

    <!-- Zona Roja: Cuello Anterior -->
    <circle cx="0" cy="80" r="6" fill="#ef4444" filter="url(#glowRed)"/>
    <line x1="0" y1="80" x2="-80" y2="70" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="-85" y="74" text-anchor="end" fill="#fca5a5" font-size="11" font-weight="600">Tráquea / Seno carotídeo (PROHIBIDO)</text>

    <!-- Punto Verde: Pectoral Menor -->
    <circle cx="32" cy="130" r="6" fill="#10b981" filter="url(#glowGreen)"/>
    <line x1="32" y1="130" x2="115" y2="120" stroke="#10b981" stroke-width="1.2"/>
    <text x="120" y="124" fill="#6ee7b7" font-size="11" font-weight="600">Pectoral Menor (Subcoracoideo)</text>
    <text x="120" y="138" fill="#94a3b8" font-size="10">Libera escápula para Torso (Día C)</text>

    <!-- Zona Roja: Fosa Axilar -->
    <circle cx="-55" cy="145" r="6" fill="#ef4444" filter="url(#glowRed)"/>
    <line x1="-55" y1="145" x2="-120" y2="145" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="-125" y="149" text-anchor="end" fill="#fca5a5" font-size="11" font-weight="600">Hueco Axilar (Plexo braquial / Vasos)</text>

    <!-- Punto Verde: Bíceps / Braquial -->
    <circle cx="75" cy="185" r="6" fill="#10b981" filter="url(#glowGreen)"/>
    <line x1="75" y1="185" x2="135" y2="185" stroke="#10b981" stroke-width="1.2"/>
    <text x="140" y="189" fill="#6ee7b7" font-size="11" font-weight="600">Braquial Anterior / Bíceps</text>
    <text x="140" y="202" fill="#94a3b8" font-size="10">Pre-Predicador (Días B/E)</text>

    <!-- Zona Roja: Codo Anterior / Epitróclea -->
    <circle cx="-80" cy="225" r="6" fill="#ef4444" filter="url(#glowRed)"/>
    <line x1="-80" y1="225" x2="-130" y2="225" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="-135" y="229" text-anchor="end" fill="#fca5a5" font-size="11" font-weight="600">Pliegue Codo / Nervio cubital</text>

    <!-- Punto Verde: Flexores de Cadera (Psoas/TFL) -->
    <circle cx="-25" cy="295" r="7" fill="#10b981" filter="url(#glowGreen)"/>
    <circle cx="25" cy="295" r="7" fill="#10b981" filter="url(#glowGreen)"/>
    <line x1="-25" y1="295" x2="-115" y2="285" stroke="#10b981" stroke-width="1.2"/>
    <text x="-120" y="285" text-anchor="end" fill="#6ee7b7" font-size="11" font-weight="700">Flexores Cadera (Psoas/TFL)</text>
    <text x="-120" y="299" text-anchor="end" fill="#94a3b8" font-size="10">Desbloqueo extensión pélvica (Hip Thrust)</text>

    <!-- Zona Roja: Triángulo de Scarpa -->
    <circle cx="10" cy="315" r="6" fill="#ef4444" filter="url(#glowRed)"/>
    <line x1="10" y1="315" x2="85" y2="315" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="90" y="319" fill="#fca5a5" font-size="11" font-weight="600">Triángulo Scarpa (Arteria femoral)</text>

    <!-- Punto Verde: Vasto Lateral Cuádriceps -->
    <circle cx="48" cy="405" r="6" fill="#10b981" filter="url(#glowGreen)"/>
    <line x1="48" y1="405" x2="115" y2="405" stroke="#10b981" stroke-width="1.2"/>
    <text x="120" y="409" fill="#6ee7b7" font-size="11" font-weight="600">Vasto Lateral (No cintilla)</text>
    <text x="120" y="422" fill="#94a3b8" font-size="10">Deslizamiento pre-Hack (Días A/D)</text>
  </g>

  <!-- ==================== VISTA POSTERIOR ==================== -->
  <g transform="translate(730, 130)">
    <text x="0" y="0" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700" letter-spacing="1">VISTA POSTERIOR (DORSAL)</text>

    <!-- Silueta Humana Dorsal -->
    <ellipse cx="0" cy="45" rx="20" ry="26" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1.5"/>
    <path d="M -12 70 Q -10 85 -28 95 Q -40 102 -68 115 Q -78 122 -82 135 L -105 240 Q -112 270 -115 315 L -115 330 Q -115 338 -108 338 Q -102 338 -100 328 L -90 250 L -72 165 Q -65 175 -50 185 L -45 285 Q -45 315 -58 340 L -62 460 Q -65 520 -58 575 L -58 600 Q -58 608 -50 608 Q -42 608 -42 595 L -35 520 Q -32 460 -22 365 L -15 340 Q -6 340 0 340 Q 6 340 15 340 L 22 365 Q 32 460 35 520 L 42 595 Q 42 608 50 608 Q 58 608 58 600 L 58 575 Q 65 520 62 460 L 58 340 Q 45 315 45 285 L 50 185 Q 65 175 72 165 L 90 250 L 100 328 Q 102 338 108 338 Q 115 338 115 330 L 115 315 Q 112 270 105 240 L 82 135 Q 78 122 68 115 Q 40 102 28 95 Q 10 85 12 70 Z" fill="url(#bodyGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Puntos Vista Posterior -->

    <!-- Zona Roja: Raquis / Apófisis Espinosas -->
    <line x1="0" y1="100" x2="0" y2="270" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="0" cy="180" r="5" fill="#ef4444" filter="url(#glowRed)"/>
    <line x1="0" y1="180" x2="-80" y2="180" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="-85" y="184" text-anchor="end" fill="#fca5a5" font-size="11" font-weight="600">Columna vertebral (PROHIBIDO)</text>

    <!-- Punto Verde: Manguito Posterior (Infraespinoso) -->
    <circle cx="36" cy="135" r="6" fill="#10b981" filter="url(#glowGreen)"/>
    <line x1="36" y1="135" x2="115" y2="125" stroke="#10b981" stroke-width="1.2"/>
    <text x="120" y="129" fill="#6ee7b7" font-size="11" font-weight="600">Infraespinoso / Redondo Menor</text>
    <text x="120" y="142" fill="#94a3b8" font-size="10">Rotación externa (Peck-deck/Laterales)</text>

    <!-- Punto Azul: Tríceps Cabeza Larga -->
    <circle cx="-68" cy="170" r="6" fill="#38bdf8" filter="url(#glowBlue)"/>
    <line x1="-68" y1="170" x2="-130" y2="170" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="-135" y="174" text-anchor="end" fill="#7dd3fc" font-size="11" font-weight="600">Tríceps (Cabeza Larga)</text>
    <text x="-135" y="187" text-anchor="end" fill="#94a3b8" font-size="10">Descarga post-extensión (Días B/E)</text>

    <!-- Punto Azul: Dorsal Ancho Lateral -->
    <circle cx="42" cy="205" r="6" fill="#38bdf8" filter="url(#glowBlue)"/>
    <line x1="42" y1="205" x2="115" y2="205" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="120" y="209" fill="#7dd3fc" font-size="11" font-weight="600">Dorsal Ancho (Borde Costal)</text>
    <text x="120" y="222" fill="#94a3b8" font-size="10">Descarga / Alivio tirantez axilar</text>

    <!-- Punto Azul: Glúteo Medio y Piramidal -->
    <circle cx="-32" cy="305" r="7" fill="#38bdf8" filter="url(#glowBlue)"/>
    <circle cx="32" cy="305" r="7" fill="#38bdf8" filter="url(#glowBlue)"/>
    <line x1="32" y1="305" x2="115" y2="295" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="120" y="295" fill="#7dd3fc" font-size="11" font-weight="700">Glúteo Medio &amp; Pelvitrocantéreos</text>
    <text x="120" y="309" fill="#94a3b8" font-size="10">Descarga tono estabilizador pélvico</text>

    <!-- Punto Azul: Glúteo Mayor Carnoso -->
    <circle cx="-25" cy="335" r="6" fill="#38bdf8" filter="url(#glowBlue)"/>
    <line x1="-25" y1="335" x2="-115" y2="335" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="-120" y="339" text-anchor="end" fill="#7dd3fc" font-size="11" font-weight="600">Glúteo Mayor (Vientre medio)</text>
    <text x="-120" y="352" text-anchor="end" fill="#94a3b8" font-size="10">Descarga nocturna o descanso</text>

    <!-- Zona Roja: Hueco Poplíteo -->
    <circle cx="-28" cy="465" r="6" fill="#ef4444" filter="url(#glowRed)"/>
    <circle cx="28" cy="465" r="6" fill="#ef4444" filter="url(#glowRed)"/>
    <line x1="28" y1="465" x2="105" y2="465" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="110" y="469" fill="#fca5a5" font-size="11" font-weight="600">Hueco Poplíteo (N. Ciático / Vena)</text>

    <!-- Punto Verde: Fascia Plantar / Sóleo distal -->
    <circle cx="-46" cy="595" r="5" fill="#10b981" filter="url(#glowGreen)"/>
    <line x1="-46" y1="595" x2="-115" y2="595" stroke="#10b981" stroke-width="1.2"/>
    <text x="-120" y="599" text-anchor="end" fill="#6ee7b7" font-size="11" font-weight="600">Planta del pie (Arco medial)</text>
    <text x="-120" y="612" text-anchor="end" fill="#94a3b8" font-size="10">Activación trípode previo a sentadilla</text>
  </g>

  <!-- Footer Banner -->
  <rect x="50" y="725" width="900" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="500" y="748" text-anchor="middle" fill="#94a3b8" font-size="12">
    💡 <tspan fill="#f1f5f9" font-weight="600">Regla de oro:</tspan> Deja rebotar el cabezal pasivamente. Si el motor se frena por hundirlo, la fuerza es contraproducente para el tejido.
  </text>
</svg>