<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Limpiar caché</title>
<body style="font-family:system-ui;padding:24px"><h1>Limpiar caché</h1><p id="m">Limpiando…</p><p><a href="./">Abrir la app</a></p>
<script>(async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k);document.getElementById("m").textContent="Listo: service workers y cachés eliminados (tus datos locales siguen intactos).";}catch(e){document.getElementById("m").textContent="Error: "+e;}})();</script></body></html>
